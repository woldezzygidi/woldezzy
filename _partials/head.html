<!--
  HEAD PARTIAL — copy this into each page's <head>.
  Variables to replace per page: {{TITLE}}, {{DESC}}, {{CANONICAL}}, {{OG_TYPE}}, {{OG_IMAGE}}
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">

<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:site_name" content="'Wole Oduwole">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@woldezzy">
<meta name="twitter:creator" content="@woldezzy">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<!-- Theme bootstrap: runs before first paint, prevents flash of wrong theme -->
<script>
(function(){try{var t=localStorage.getItem('woldezzy:theme');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();
</script>

<!-- Fonts: self-hosted variable, preloaded, swap + size-adjust fallback to eliminate CLS -->
<link rel="preload" href="/public/fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="/css/main.css">
